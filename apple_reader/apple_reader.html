<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography — Dedicated Reader</title>
    <style>
        /* 苹果系统字体与全局复位 */
        :root {
            --bg-color: #0f0f11;
            --text-color: #e3e3e8;
            --accent-color: #2997ff;
            --panel-bg: rgba(26, 26, 30, 0.65);
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --font-serif: "New York", "Georgia", "Songti SC", serif;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --panel-bg: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* 主阅读容器 */
        #reader-container {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            overflow-y: auto;
            padding: 120px 24px 160px;
            scroll-behavior: smooth;
        }

        /* 隐藏滚动条但保留功能 */
        #reader-container::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* 文本展示区 */
        #content {
            font-size: 19px;
            line-height: 1.85;
            letter-spacing: 0.012em;
            word-wrap: break-word;
            white-space: pre-wrap;
            user-select: text;
            opacity: 0.92;
            transition: font-size 0.3s ease;
        }

        #content p {
            margin-bottom: 1.8em;
        }

        /* 空状态提示 */
        #content:empty::before {
            content: "将文本拖入此处，或按 Cmd+V 粘贴...\n\n\"Details matter, it's worth getting it right.\"";
            color: rgba(140, 140, 145, 0.5);
            font-style: italic;
            font-family: var(--font-serif);
            line-height: 2;
            display: block;
            text-align: center;
            margin-top: 30vh;
            white-space: pre-line;
        }

        /* 悬浮控制面板 (极简晶莹质感) */
        .control-panel {
            position: fixed;
            top: 28px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        body:hover .control-panel {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }

        .btn:hover {
            opacity: 1;
            background: rgba(150, 150, 150, 0.15);
        }

        /* 底部隐形阅读进度条 */
        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            transition: width 0.1s ease-out;
        }
    </style>
</head>
<body>

    <!-- 顶部极简控制工具栏 -->
    <div class="control-panel">
        <button class="btn" onclick="toggleTheme()">主题</button>
        <button class="btn" onclick="toggleFont()">字体</button>
        <button class="btn" onclick="adjustFontSize(1)">A+</button>
        <button class="btn" onclick="adjustFontSize(-1)">A-</button>
        <button class="btn" onclick="clearText()">清空</button>
    </div>

    <!-- 文本阅读核心区域 -->
    <div id="reader-container">
        <div id="content" contenteditable="true" spellcheck="false"></div>
    </div>

    <!-- 底部进度条 -->
    <div id="progress-bar"></div>

    <script>
        const container = document.getElementById('reader-container');
        const content = document.getElementById('content');
        const progressBar = document.getElementById('progress-bar');
        let currentFontSize = 19;
        let isSerif = false;

        // 监听滚动更新进度条
        container.addEventListener('scroll', () => {
            const totalHeight = container.scrollHeight - container.clientHeight;
            if (totalHeight > 0) {
                const progress = (container.scrollTop / totalHeight) * 100;
                progressBar.style.width = `${progress}%`;
            } else {
                progressBar.style.width = '0%';
            }
        });

        // 智能纯文本粘贴（自动清理任何格式、颜色、内联图像）
        content.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, text);
        });

        // 支持拖拽文件读取
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('text/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    content.innerText = event.target.result;
                    container.scrollTop = 0;
                };
                reader.readAsText(file);
            }
        });

        // 调色盘切换 (Dark / Light)
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', 'light');
            }
        }

        // 字体切换 (无衬线 San Francisco / 衬线 New York)
        function toggleFont() {
            isSerif = !isSerif;
            content.style.fontFamily = isSerif ? 'var(--font-serif)' : 'var(--font-main)';
        }

        // 字体大小调节
        function adjustFontSize(delta) {
            currentFontSize = Math.min(Math.max(14, currentFontSize + delta), 32);
            content.style.fontSize = `${currentFontSize}px`;
        }

        // 清空文本
        function clearText() {
            content.innerText = '';
            progressBar.style.width = '0%';
        }
    </script>
</body>
</html>
