<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Teleprompter (Enhanced Paste & Local Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            transition: background-color 0.3s ease; 
        }
        #scroll-container { 
            height: 100vh; 
            overflow-y: auto; 
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        #scroll-container::-webkit-scrollbar { 
            display: none; 
        }
        #content-area { 
            min-height: 101vh; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            outline: none; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding-bottom: 70vh; 
            padding-top: 100px; 
        }

        /* 强制内容区域内的子元素继承前景色与背景色，排除 size 干扰，但保留基本排版 */
        #content-area * {
            color: inherit !important;
            font-size: inherit !important;
            background: transparent !important;
            background-color: transparent !important;
        }

        #content-area ul {
            list-style-type: disc;
            padding-left: 40px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        #content-area ol {
            list-style-type: decimal;
            padding-left: 40px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        #content-area li {
            display: list-item;
        }

        .toolbar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            z-index: 100; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(5px); 
            border-bottom: 1px solid #ddd; 
            display: flex; 
            align-items: center; 
            padding: 8px 16px; 
            gap: 12px; 
            transition: transform 0.3s ease; 
        }
        .toolbar.hidden { 
            transform: translateY(-100%); 
        }
        .control-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border-right: 1px solid #ccc; 
            padding-right: 12px; 
        }
        label { 
            font-size: 11px; 
            font-weight: 700; 
            color: #666; 
            text-transform: uppercase; 
        }
        select, input[type="color"], input[type="number"] { 
            padding: 4px; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
            font-size: 13px; 
        }
        .status-indicator { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            padding: 8px 16px; 
            border-radius: 20px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            font-size: 12px; 
            pointer-events: none; 
            opacity: 0.8; 
            z-index: 1000; 
        }

        /* Paste-to-top toast prompt */
        #paste-toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 15, 15, 0.92);
            color: #fff;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            font-family: sans-serif;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            white-space: nowrap;
        }
        #paste-toast.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        #paste-toast .toast-msg {
            color: #e0e0e0;
        }
        #paste-toast button {
            border: none;
            border-radius: 7px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        #paste-toast button:hover { opacity: 0.85; }
        #toast-yes {
            background: #22c55e;
            color: #fff;
        }
        #toast-no {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
    </style>
</head>
<body id="main-body" class="bg-white">

    <div id="toolbar" class="toolbar">
        <div class="control-group">
            <label>Font</label>
            <select id="font-family">
                <option value="sans-serif">Sans Serif</option>
                <option value="serif">Serif</option>
                <option value="monospace">Monospace</option>
            </select>
        </div>

        <div class="control-group">
            <label>Size</label>
            <input type="number" id="font-size-input" value="48" min="10" max="200" style="width: 60px;">
        </div>

        <div class="control-group">
            <label>Color</label>
            <input type="color" id="font-color" value="#000000">
        </div>

        <div class="control-group">
            <label>BG</label>
            <input type="color" id="bg-color" value="#ffffff">
        </div>

        <div class="text-[10px] text-gray-500 uppercase font-bold tracking-tight">
            ENT: Play/Stop | TAB: Full | +/-: Resize
        </div>
    </div>

    <div id="scroll-container">
        <div id="content-area" contenteditable="true" spellcheck="false">
Welcome. Paste your text here.
Settings and scroll position are now saved locally in your browser.
        </div>
    </div>

    <div id="status" class="status-indicator">Stopped</div>

    <div id="paste-toast">
        <span class="toast-msg">📋 Text pasted. Jump to top?</span>
        <button id="toast-yes" tabindex="-1">Go to Top</button>
        <button id="toast-no" tabindex="-1">Stay Here</button>
    </div>

    <script>
        // DOM Elements
        const container = document.getElementById('scroll-container');
        const content = document.getElementById('content-area');
        const body = document.getElementById('main-body');
        const toolbar = document.getElementById('toolbar');
        const status = document.getElementById('status');
        const pasteToast = document.getElementById('paste-toast');
        
        const fontFamilySelect = document.getElementById('font-family');
        const fontSizeInput = document.getElementById('font-size-input');
        const fontColorInput = document.getElementById('font-color');
        const bgColorInput = document.getElementById('bg-color');

        let isScrolling = false;
        let lastMouseY = 0;
        let animationFrame;
        let toastDismissTimer = null;
        const STORAGE_KEY = 'teleprompter_local_settings';

        const MIN_SPEED = 0.0168;
        const MAX_SPEED = 2.0;
        let decimalAccumulator = 0;

        // --- PASTE TOAST ---
        function showPasteToast() {
            clearTimeout(toastDismissTimer);
            pasteToast.classList.add('visible');
            toastDismissTimer = setTimeout(hidePasteToast, 6000);
        }

        function hidePasteToast() {
            clearTimeout(toastDismissTimer);
            pasteToast.classList.remove('visible');
        }

        document.getElementById('toast-yes').addEventListener('click', () => {
            container.scrollTo({ top: 0, behavior: 'smooth' });
            hidePasteToast();
            saveData();
        });

        document.getElementById('toast-no').addEventListener('click', hidePasteToast);

        // --- LOCAL STORAGE OPERATIONS ---
        function saveData() {
            const settings = {
                textHtml: content.innerHTML, // 使用 innerHTML 保证格式（加粗等）能够被保存
                fontFamily: fontFamilySelect.value,
                fontSize: fontSizeInput.value,
                fontColor: fontColorInput.value,
                bgColor: bgColorInput.value,
                scrollPos: container.scrollTop,
                updatedAt: Date.now()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                // 兼容老版本无 textHtml 的情况
                if (data.textHtml !== undefined) {
                    content.innerHTML = data.textHtml;
                } else if (data.text !== undefined) {
                    content.innerText = data.text;
                }
                
                fontFamilySelect.value = data.fontFamily || "sans-serif";
                fontSizeInput.value = data.fontSize || "48";
                fontColorInput.value = data.fontColor || "#000000";
                bgColorInput.value = data.bgColor || "#ffffff";
                
                applyStyles(false); 

                setTimeout(() => {
                    container.scrollTop = data.scrollPos || 0;
                }, 50);
            }
        }

        // --- TELEPROMPTER LOGIC ---
        function applyStyles(shouldSave = true) {
            content.style.fontFamily = fontFamilySelect.value;
            content.style.fontSize = fontSizeInput.value + 'px';
            content.style.color = fontColorInput.value;
            body.style.backgroundColor = bgColorInput.value;
            if (shouldSave) saveData();
        }

        function scrollLoop() {
            if (!isScrolling) return;
            const windowHeight = window.innerHeight;
            const ratio = lastMouseY / windowHeight;
            const scrollSpeed = MIN_SPEED + (ratio * (MAX_SPEED - MIN_SPEED));
            
            decimalAccumulator += scrollSpeed;
            
            if (decimalAccumulator >= 1) {
                const pixelsToScroll = Math.floor(decimalAccumulator);
                container.scrollTop += pixelsToScroll;
                decimalAccumulator -= pixelsToScroll;
            }

            if (container.scrollTop + container.clientHeight >= container.scrollHeight) {
                stopScrolling();
            } else {
                animationFrame = requestAnimationFrame(scrollLoop);
            }
        }

        function startScrolling() {
            if (isScrolling) return;
            isScrolling = true;
            decimalAccumulator = 0; 
            status.innerText = "Scrolling";
            status.style.background = "rgba(34, 197, 94, 0.8)";
            scrollLoop();
        }

        function stopScrolling() {
            isScrolling = false;
            cancelAnimationFrame(animationFrame);
            status.innerText = "Stopped";
            status.style.background = "rgba(0, 0, 0, 0.6)";
            saveData(); 
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.error(e));
                toolbar.classList.add('hidden');
            } else {
                document.exitFullscreen();
                toolbar.classList.remove('hidden');
            }
        }

        // --- PASTE & FORMAT CONVERSION LOGIC ---

        // 简易 Markdown 转 HTML 模块 (只提取粗体、斜体、下划线及列表，忽略标题等大小字号)
        function convertMarkdownToHtml(mdText) {
            let html = mdText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // 1. 粗斜体 ***text*** 或 ___text___
            html = html.replace(/(\*\*\*|___)(.*?)\1/g, '<strong><em>$2</em></strong>');
            
            // 2. 粗体 **text** 或 __text__
            html = html.replace(/(\*\*|__)(.*?)\1/g, '<strong>$2</strong>');
            
            // 3. 斜体 *text* 或 _text_
            html = html.replace(/(\*|_)(.*?)\1/g, '<em>$2</em>');

            // 4. 下划线 (非标 Md 语法，但常用如 <u>text</u> 或 ++text++)
            html = html.replace(/\+\+(.*?)\+\+/g, '<u>$1</u>');

            // 5. 处理段落与换行及列表
            const lines = html.split(/\r?\n/);
            let inList = false;
            let listType = null; // 'ul' or 'ol'
            let resultLines = [];

            lines.forEach(line => {
                const trimmed = line.trim();
                
                // 无序列表判断
                const ulMatch = line.match(/^(\s*)([-*+])\s+(.*)/);
                // 有序列表判断
                const olMatch = line.match(/^(\s*)(\d+)\.\s+(.*)/);

                if (ulMatch) {
                    if (!inList || listType !== 'ul') {
                        if (inList) resultLines.push(`</${listType}>`);
                        resultLines.push('<ul>');
                        inList = true;
                        listType = 'ul';
                    }
                    resultLines.push(`<li>${ulMatch[3]}</li>`);
                } else if (olMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) resultLines.push(`</${listType}>`);
                        resultLines.push('<ol>');
                        inList = true;
                        listType = 'ol';
                    }
                    resultLines.push(`<li>${olMatch[3]}</li>`);
                } else {
                    if (inList) {
                        resultLines.push(`</${listType}>`);
                        inList = false;
                        listType = null;
                    }
                    
                    // 忽略 Markdown 标题大小，直接将其视作粗体普通文本
                    if (trimmed.startsWith('#')) {
                        const headingText = trimmed.replace(/^#+\s*/, '');
                        resultLines.push(`<div><strong>${headingText}</strong></div>`);
                    } else if (trimmed === '') {
                        resultLines.push('<div><br></div>');
                    } else {
                        resultLines.push(`<div>${line}</div>`);
                    }
                }
            });

            if (inList) {
                resultLines.push(`</${listType}>`);
            }

            return resultLines.join('');
        }

        // HTML 富文本清洗，滤掉所有大小相关的属性
        function cleanRichHtml(htmlContent) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');
            
            // 递归过滤节点
            function sanitizeNode(node) {
                if (node.nodeType === Node.ELEMENT_NODE) {
                    // 1. 移除 style 属性中关于 font-size 的设定，或直接移除全部 style (保留基础表现由提词器统一控制)
                    if (node.hasAttribute('style')) {
                        let style = node.getAttribute('style');
                        // 移除 font-size, line-height 属性，防止干扰
                        style = style.replace(/font-size\s*:\s*[^;]+;?/gi, '');
                        style = style.replace(/line-height\s*:\s*[^;]+;?/gi, '');
                        if (style.trim() === '') {
                            node.removeAttribute('style');
                        } else {
                            node.setAttribute('style', style);
                        }
                    }
                    
                    // 2. 移除 font 标签的 size 属性
                    if (node.tagName.toLowerCase() === 'font') {
                        node.removeAttribute('size');
                        node.removeAttribute('face');
                    }

                    // 3. 将 H1-H6 标题降级为普通的粗体（以免带有系统自带的巨大字号）
                    if (/^H[1-6]$/.test(node.tagName)) {
                        const span = doc.createElement('strong');
                        span.innerHTML = node.innerHTML;
                        node.parentNode.replaceChild(span, node);
                        sanitizeNode(span);
                        return;
                    }

                    // 4. 如果遇到不允许保留的干扰标签，可降级为普通 text 或 div (如特定排版容器)
                    // 此处对子节点进行递归清洗
                    const children = Array.from(node.childNodes);
                    children.forEach(child => sanitizeNode(child));
                }
            }

            Array.from(doc.body.childNodes).forEach(node => sanitizeNode(node));
            return doc.body.innerHTML;
        }

        // 识别文本是否很有可能是 Markdown
        function isMarkdown(text) {
            // 如果含有常见 Md 语法（如：# 标题，**粗体**，*斜体*，- 列表项），判定为 md
            const hasHeaders = /^#+\s+.+/m.test(text);
            const hasBold = /(\*\*|__).+\1/.test(text);
            const hasItalic = /(\*|_).+\1/.test(text);
            const hasList = /^(\s*)[-*+]\s+.+/m.test(text) || /^(\s*)\d+\.\s+.+/m.test(text);
            
            return hasHeaders || hasBold || hasItalic || hasList;
        }

        // --- EVENT LISTENERS ---
        window.addEventListener('mousemove', (e) => { lastMouseY = e.clientY; });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                toggleFullscreen();
            }
            if (e.key === 'Enter') {
                if (document.activeElement !== content) {
                    e.preventDefault();
                    isScrolling ? stopScrolling() : startScrolling();
                } else if (e.ctrlKey) {
                    e.preventDefault();
                    isScrolling ? stopScrolling() : startScrolling();
                    content.blur();
                }
            }
            if (e.key === '+' || e.key === '=') {
                fontSizeInput.value = parseInt(fontSizeInput.value) + 2;
                applyStyles();
            }
            if (e.key === '-' || e.key === '_') {
                fontSizeInput.value = Math.max(10, parseInt(fontSizeInput.value) - 2);
                applyStyles();
            }
        });

        // 拦截粘贴事件：保留基础排版，剔除字号和底色
        content.addEventListener('paste', (e) => {
            e.preventDefault();
            
            const clipboardData = e.clipboardData || window.clipboardData;
            const htmlData = clipboardData.getData('text/html');
            const plainText = clipboardData.getData('text/plain');

            let processedHtml = "";

            if (htmlData && htmlData.trim() !== "") {
                // 情况一：粘贴的是富文本，清洗 HTML
                processedHtml = cleanRichHtml(htmlData);
            } else if (plainText && isMarkdown(plainText)) {
                // 情况二：无富文本，但纯文本属于 Markdown 格式，进行自动转换
                processedHtml = convertMarkdownToHtml(plainText);
            } else {
                // 情况三：普通纯文本，按换行切分，安全插入
                processedHtml = plainText
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .split(/\r?\n/)
                    .map(line => line === "" ? "<div><br></div>" : `<div>${line}</div>`)
                    .join("");
            }

            // 执行插入
            document.execCommand('insertHTML', false, processedHtml);

            // 保持原有的 Toast 提示和保存逻辑
            setTimeout(() => {
                if (container.scrollTop > 100) {
                    showPasteToast();
                }
                saveData();
            }, 50);
        });

        let debounceTimer;
        content.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(saveData, 1000);
        });

        fontFamilySelect.addEventListener('change', () => applyStyles());
        fontSizeInput.addEventListener('input', () => applyStyles());
        fontColorInput.addEventListener('input', () => applyStyles());
        bgColorInput.addEventListener('input', () => applyStyles());

        container.addEventListener('scroll', () => {
            if (!isScrolling) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(saveData, 500);
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) toolbar.classList.remove('hidden');
        });

        window.onload = loadData;
    </script>
</body>
</html>
