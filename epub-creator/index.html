<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简富文本 EPUB 生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    /* 富文本编辑器占位符样式 */
    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
      cursor: text;
    }
  </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-2xl w-full bg-white shadow-xl rounded-2xl p-6 space-y-4">
    <div class="border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">极简富文本 EPUB 生成器</h1>
      <p class="text-sm text-gray-500">完美保留从 Mac 备忘录/Word 复制的加粗、斜体、下划线及换行格式。</p>
    </div>

    <div class="space-y-4">
      <!-- 书籍标题输入 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">书籍标题</label>
        <input type="text" id="book-title" value="我的电子书" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- 富文本编辑器容器 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">书籍内容</label>
        <div class="border border-gray-300 rounded-lg focus-within:ring-2 focus-within:ring-blue-500 overflow-hidden flex flex-col bg-white">
          
          <!-- 工具栏 -->
          <div class="flex items-center gap-1 p-2 bg-gray-50 border-b border-gray-200 select-none">
            <button type="button" onclick="formatDoc('bold')" class="p-1.5 rounded text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition-colors" title="加粗">
              <span class="font-bold text-sm">B</span>
            </button>
            <button type="button" onclick="formatDoc('italic')" class="p-1.5 rounded text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition-colors" title="斜体">
              <span class="italic text-sm">I</span>
            </button>
            <button type="button" onclick="formatDoc('underline')" class="p-1.5 rounded text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition-colors" title="下划线">
              <span class="underline text-sm">U</span>
            </button>
            <div class="h-4 w-[1px] bg-gray-300 mx-1"></div>
            <button type="button" onclick="formatDoc('removeFormat')" class="p-1.5 rounded text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition-colors text-xs font-semibold" title="清除格式">
              Tx
            </button>
          </div>

          <!-- 富文本编辑区域 -->
          <div id="book-content" contenteditable="true" class="p-4 outline-none min-h-[350px] max-h-[500px] overflow-y-auto text-sm leading-relaxed text-gray-800" placeholder="在此直接粘贴您的内容（支持保留原排版如：加粗、斜体、下划线及换行）..."></div>
        </div>
      </div>

      <!-- 生成按钮 -->
      <button onclick="generateEpub()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        生成并下载 EPUB
      </button>
    </div>

    <!-- 状态提示 -->
    <div id="status" class="text-center text-sm font-medium hidden"></div>
  </div>

  <script>
    function formatDoc(cmd, value = null) {
      document.execCommand(cmd, false, value);
      document.getElementById('book-content').focus();
    }

    // 由于 EPUB 标准使用极为严苛的 XHTML 格式，必须将富文本完美的转换为兼容 XML 的节点代码
    function cleanHTMLtoXHTML(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      function serialize(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          // 严格转义 XML 字符
          return node.nodeValue
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&apos;");
        }
        
        if (node.nodeType === Node.ELEMENT_NODE) {
          const tagName = node.tagName.toLowerCase();
          
          let targetTag = '';
          let hasStyles = false;
          let styleAttr = '';

          // 规范化标签映射
          if (['strong', 'b'].includes(tagName)) {
            targetTag = 'strong';
          } else if (['em', 'i'].includes(tagName)) {
            targetTag = 'em';
          } else if (tagName === 'u') {
            targetTag = 'span';
            styleAttr = 'text-decoration: underline;';
            hasStyles = true;
          } else if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li'].includes(tagName)) {
            targetTag = (tagName === 'div') ? 'p' : tagName; // 将 divs 统一转化为段落以获得更佳电子书兼容性
          } else if (['ul', 'ol'].includes(tagName)) {
            targetTag = tagName;
          } else if (tagName === 'br') {
            return '<br />'; // 严格闭合
          } else if (tagName === 'span') {
            // 保留可能存在的下划线或删除线样式
            const style = node.getAttribute('style') || '';
            if (style.includes('underline')) {
              targetTag = 'span';
              styleAttr = 'text-decoration: underline;';
              hasStyles = true;
            } else if (style.includes('line-through')) {
              targetTag = 'span';
              styleAttr = 'text-decoration: line-through;';
              hasStyles = true;
            } else {
              // 普通无样式的 span 直接解析子节点
              let childrenStr = '';
              for (let child of node.childNodes) {
                childrenStr += serialize(child);
              }
              return childrenStr;
            }
          } else {
            // 其余不支持的复杂格式剥离外皮，保留内容
            let childrenStr = '';
            for (let child of node.childNodes) {
              childrenStr += serialize(child);
            }
            return childrenStr;
          }

          // 递归处理子节点
          let childrenStr = '';
          for (let child of node.childNodes) {
            childrenStr += serialize(child);
          }

          const attrStr = hasStyles ? ` style="${styleAttr}"` : '';
          return `<${targetTag}${attrStr}>${childrenStr}</${targetTag}>`;
        }
        return '';
      }

      let xhtml = '';
      for (let node of doc.body.childNodes) {
        xhtml += serialize(node);
      }
      return xhtml.trim();
    }

    async function generateEpub() {
      const title = document.getElementById('book-title').value.trim() || '未命名书籍';
      const editorElement = document.getElementById('book-content');
      const status = document.getElementById('status');

      // 获取富文本编辑器的 innerHTML
      const rawHtmlContent = editorElement.innerHTML;
      const textContent = editorElement.innerText.trim();

      if (!textContent) {
        // 使用页面级提示代替 alert
        status.className = "text-center text-sm font-medium text-red-600 block";
        status.innerText = "请先粘贴或编写一些内容。";
        setTimeout(() => status.classList.add('hidden'), 3000);
        return;
      }

      status.className = "text-center text-sm font-medium text-blue-600 block";
      status.innerText = "正在整理富文本并打包，请稍候...";

      try {
        const zip = new JSZip();
        const uuid = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2);

        // 1. mimetype (必须在压缩包最前面，不能压缩)
        zip.file("mimetype", "application/epub+zip", { compression: "STORE" });

        // 2. container.xml
        zip.file("META-INF/container.xml", `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml" />
  </rootfiles>
</container>`);

        // 3. 样式表 (优雅的电子书阅读排版)
        zip.file("OEBPS/style.css", `
          body { 
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; 
            padding: 5%; 
            line-height: 1.6; 
            color: #222;
          }
          h1 { text-align: center; margin-bottom: 1.8em; font-size: 1.8em; font-weight: bold; }
          p { margin-top: 0; margin-bottom: 1em; text-align: justify; }
          strong { font-weight: bold; }
          em { font-style: italic; }
          ul, ol { padding-left: 1.5em; margin-bottom: 1em; }
          li { margin-bottom: 0.5em; }
        `);

        // 4. 将富文本转换为严格规范的 XHTML 内容
        const xhtmlContent = cleanHTMLtoXHTML(rawHtmlContent);

        zip.file("OEBPS/text.xhtml", `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh">
<head>
  <title>${title}</title>
  <link rel="stylesheet" href="style.css" type="text/css" />
</head>
<body>
  <h1>${title}</h1>
  <div class="content-block">
    ${xhtmlContent}
  </div>
</body>
</html>`);

        // 5. content.opf
        zip.file("OEBPS/content.opf", `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="pub-id" version="3.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="pub-id">urn:uuid:${uuid}</dc:identifier>
    <dc:title>${title}</dc:title>
    <dc:language>zh</dc:language>
    <meta property="dcterms:modified">${new Date().toISOString().split('.')[0]}Z</meta>
  </metadata>
  <manifest>
    <item id="style" href="style.css" media-type="text/css" />
    <item id="text" href="text.xhtml" media-type="application/xhtml+xml" />
  </manifest>
  <spine>
    <itemref idref="text" />
  </spine>
</package>`);

        // 6. 生成并下载
        const blob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.epub`;
        a.click();
        
        status.className = "text-center text-sm font-medium text-green-600 block";
        status.innerText = "生成成功！已触发下载。";
        setTimeout(() => status.classList.add('hidden'), 3000);

      } catch (err) {
        status.className = "text-center text-sm font-medium text-red-600 block";
        status.innerText = "出错了: " + err.message;
      }
    }
  </script>
</body>
</html>
