        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        繁體中文 (Traditional)
                    </label>
                    <button id="clearBtn" class="text-xs text-slate-400 hover:text-red-500 transition-colors uppercase tracking-wider font-bold">Clear</button>
                </div>
                <textarea 
                    id="inputArea"

                ></textarea>
                <div class="mt-4 text-xs text-slate-400" id="charCount">0 字</div>
            </div>

            <!-- Output Section -->
            <div class="glass-card rounded-2xl p-6 shadow-sm flex flex-col h-[500px]">
                <div class="flex justify-between items-center mb-4">

                        简体中文 (Simplified)

                        id="copyBtn"

                    >

                        <span>Copy</span>
                    </button>
                </div>

                    id="outputArea" 
                    class="flex-1 w-full p-4 bg-white border border-slate-200 rounded-xl overflow-y-auto text-lg text-slate-800 whitespace-pre-wrap"

        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const charCount = document.getElementById('charCount');
        const toast = document.getElementById('toast');

        function convert(text) {
            let result = '';
            for (let char of text) {
                // Check if the character exists in our map
                result += conversionMap[char] || char;
            }
            return result;
        }

        function updateOutput() {
            const text = inputArea.value;
            const converted = convert(text);
            outputArea.textContent = converted;
            charCount.textContent = `${text.length} 字`;
        }

        inputArea.addEventListener('input', updateOutput);

        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            updateOutput();
            inputArea.focus();
        });

        copyBtn.addEventListener('click', () => {
            const textToCopy = outputArea.textContent;
            if (!textToCopy) return;

            // Fallback for document.execCommand('copy') as requested
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast();
                }
            } catch (err) {
                console.error('Copy failed', err);
            }
            
            document.body.removeChild(tempTextArea);
        });

        function showToast() {
            toast.style.opacity = '1';
            const btnText = copyBtn.querySelector('span');
            const originalText = btnText.textContent;
            btnText.textContent = 'Copied!';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                btnText.textContent = originalText;
            }, 2000);
        }

        // Initialize with focus
        window.onload = () => inputArea.focus();
